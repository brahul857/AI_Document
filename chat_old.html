<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Markdown Parser Library -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-panel: #ffffff;
      --bg-chat: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --assistant-bubble: #ffffff;
      --user-bubble: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: var(--text-main);
      background-color: var(--bg-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .shell {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--bg-main);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #2563eb;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
    }

    .subtitle {
      margin: 2px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    button { cursor: pointer; transition: all 0.2s ease; }

    #clear {
      padding: 8px 16px;
      color: var(--text-muted);
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    #clear:hover {
      color: var(--text-main);
      border-color: #cbd5e1;
      background-color: #f1f5f9;
    }

    #messages {
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 600px;
      margin: auto;
      text-align: center;
      padding: 40px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border-radius: 10px;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 600;
    }

    .welcome p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .message {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      animation: rise .2s ease-out;
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: 95%;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      overflow-x: auto;
    }

    .assistant .bubble {
      background: var(--assistant-bubble);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    
    .user .bubble {
        background: #e8f1ff;
        color: #1f2937;
        border-bottom-right-radius: 2px;
    }
    /* Clean Light Mode Markdown & Table Styling */
    .bubble p { margin: 0 0 12px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { color: #2563eb; margin: 16px 0 8px; font-weight: 600; }
    .bubble ul, .bubble ol { margin: 0 0 12px 20px; padding: 0; }
   
    .bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
      text-align: left;
    }

    .bubble th, .bubble td {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
    }

    .bubble th {
      background-color: #f1f5f9;
      color: #1e3a8a;
      font-weight: 600;
    }

    .bubble tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .sources {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 12px;
    }

    .sources b {
      color: #2563eb;
      font-weight: 500;
    }

    .composer {
      padding: 20px 32px;
      background-color: var(--bg-panel);
      border-top: 1px solid var(--border-color);
    }

    form {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 160px;
      resize: none;
      padding: 13px 18px;
      color: var(--text-main);
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: 0;
      font: 14px/1.5 'Inter', system-ui, sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    #send {
      height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #send:hover { background: var(--accent-hover); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      max-width: 900px;
      height: 18px;
      margin: 8px auto 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      header { padding: 16px 20px; }
      #messages { padding: 20px 16px; }
      .composer { padding: 16px; }
      .bubble { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Private Document Assistant</p>
        <h1>COLLEGE</h1>
        <p class="subtitle">Answers are grounded in your indexed documents.</p>
      </div>
      <button id="clear" type="button">Clear Chat</button>
    </header>
    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="mark">&#128196;</div>
        <h2>What would you like to find?</h2>
        <p>Ask about facts, summaries, or details.</p>
      </div>
    </section>
    <div class="composer">
      <div id="status" role="status"></div>
      <form id="form">
        
        <textarea id="question" rows="1" placeholder="Ask a question about your documents..." aria-label="Question" required></textarea>
        <button id="send" type="submit" aria-label="Send question">Send</button>
      </form>
      <div id="status" role="status"></div>
    </div>
  </main>
  <script>
    const form=document.querySelector('#form'), 
    input=document.querySelector('#question'), 
    messages=document.querySelector('#messages'), 
    welcome=document.querySelector('#welcome'), 
    status=document.querySelector('#status'), 
    send=document.querySelector('#send');
    
    function addMessage(role,text,sources=[])
    {
        welcome.hidden=true;
        const item=document.createElement('article');
        item.className=`message ${role}`;
        const bubble=document.createElement('div');
        bubble.className='bubble';
        
        // Parse markdown text to formatted HTML
        if (typeof marked !== 'undefined') {
            bubble.innerHTML = marked.parse(text);
        } else {
            bubble.textContent = text;
        }

        if(sources.length){
            const source=document.createElement('div');
            source.className='sources';
            source.append('Sources: ');
            const names=document.createElement('b');
            names.textContent=sources.join(', ');
            source.append(names);
            bubble.append(source);
        }
        item.append(bubble);
        messages.append(item);
        messages.scrollTop=messages.scrollHeight;
    }

    form.addEventListener('submit',async event=>{
        event.preventDefault();
        const text=input.value.trim();
        if(!text||send.disabled) return;
        
        addMessage('user',text);
        input.value='';
        send.disabled=true;
        status.textContent='Searching your documents...';
        
        try{
            const response=await fetch('/api/chat',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({question:text})
            });
            const data=await response.json();
            if(!response.ok) throw new Error(data.error||'The chat service is unavailable.');
            addMessage('assistant',data.answer||'I could not find an answer.',data.sources||[]);
            status.textContent='';
        } catch(error){
            addMessage('assistant',`Sorry, I could not complete that request. ${error.message}`);
            status.textContent='Check that the server is running.';
        } finally {
            send.disabled=false;
            input.focus();
        }
    });

    document.querySelector('#clear').addEventListener('click',()=>{
        messages.querySelectorAll('.message').forEach(message=>message.remove());
        welcome.hidden=false;
        status.textContent='';
        input.focus();
    });

    input.addEventListener('keydown',event=>{
        if(event.key==='Enter'&&!event.shiftKey){
            event.preventDefault();
            form.requestSubmit();
        }
    });
  </script>
</body>
</html>
